<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Glamorous adult woman in a black dress</title>
  <desc id="desc">Stylized original fashion portrait of a confident adult woman in an elegant black dress.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17152b"/>
      <stop offset="0.55" stop-color="#4b2149"/>
      <stop offset="1" stop-color="#080914"/>
    </linearGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#20212d"/>
      <stop offset="0.5" stop-color="#050509"/>
      <stop offset="1" stop-color="#393448"/>
    </linearGradient>
    <radialGradient id="light"><stop stop-color="#ffd9bb"/><stop offset="1" stop-color="#c87969"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <g opacity=".5" filter="url(#blur)" fill="#d887d1">
    <circle cx="90" cy="170" r="55"/><circle cx="690" cy="230" r="70"/><circle cx="115" cy="700" r="45"/><circle cx="710" cy="760" r="55"/>
  </g>
  <path d="M0 820 Q190 730 400 820 T800 800 V1000 H0Z" fill="#0b0b16"/>

  <!-- hair -->
  <path d="M247 325 Q245 115 400 92 Q575 110 571 341 L526 527 Q463 592 330 533 Q259 473 247 325Z" fill="#171018"/>
  <path d="M275 286 Q300 160 405 154 Q505 157 536 280 Q472 244 415 255 Q340 258 275 286Z" fill="#2d1721"/>
  <path d="M278 275 Q218 385 288 535 L346 488 L319 282Z" fill="#21131b"/>
  <path d="M520 275 Q594 370 526 543 L469 486 L486 270Z" fill="#21131b"/>

  <!-- face and neck -->
  <path d="M321 238 Q401 192 482 240 L474 387 Q439 456 400 462 Q357 452 322 387Z" fill="url(#light)"/>
  <path d="M354 430 V520 H447 V430 Q401 468 354 430Z" fill="#e4a080"/>
  <!-- brows, eyes, nose, lips -->
  <path d="M344 301 Q366 283 386 300 M416 300 Q440 282 461 301" fill="none" stroke="#3b2027" stroke-width="10" stroke-linecap="round"/>
  <path d="M344 322 Q366 306 386 322 Q366 339 344 322 M416 322 Q439 306 461 322 Q439 339 416 322" fill="#fff" stroke="#271821" stroke-width="5"/>
  <circle cx="367" cy="322" r="7" fill="#392333"/><circle cx="439" cy="322" r="7" fill="#392333"/>
  <path d="M400 329 L388 374 L410 374" fill="none" stroke="#b96f67" stroke-width="5"/>
  <path d="M374 401 Q400 383 428 401 Q401 431 374 401Z" fill="#9d334d"/>
  <!-- earrings -->
  <circle cx="318" cy="375" r="13" fill="#f5d37a"/><circle cx="482" cy="375" r="13" fill="#f5d37a"/>

  <!-- shoulders, arms, dress -->
  <path d="M355 486 Q285 490 238 570 L181 852 Q300 925 400 906 Q500 925 619 852 L562 570 Q515 490 445 486Z" fill="url(#dress)" stroke="#77718e" stroke-width="4"/>
  <path d="M355 493 Q400 538 445 493 L477 558 Q400 610 323 558Z" fill="#b9a6c1"/>
  <path d="M282 526 Q230 556 208 664" fill="none" stroke="#e4a080" stroke-width="42" stroke-linecap="round"/>
  <path d="M518 526 Q570 556 592 664" fill="none" stroke="#e4a080" stroke-width="42" stroke-linecap="round"/>
  <path d="M208 664 L198 742 M592 664 L602 742" stroke="#f5d37a" stroke-width="7"/>
  <path d="M272 620 Q400 690 528 620 L592 852 Q400 954 208 852Z" fill="none" stroke="#6b647e" stroke-width="6" opacity=".65"/>
  <path d="M400 561 V902" stroke="#aaa0bc" stroke-width="3" opacity=".55"/>

  <!-- necklace -->
  <path d="M350 480 Q400 548 450 480" fill="none" stroke="#f5d37a" stroke-width="6"/>
  <circle cx="400" cy="536" r="12" fill="#f5d37a"/>
